preset: executive
colors:
  primary: '#1B2A4A'
  secondary: '#6B7B8D'
  accent: '#B8860B'
  text: '#2D2D2D'
  heading: '#1B2A4A'
  background: '#FFFFF5'
  link: '#1B2A4A'
  border: '#C9963B'
fonts:
  heading: Georgia
  body: Palatino Linotype
  mono: Courier New
  size_base: 11pt
  size_heading: 14pt
  size_name: 26pt
  size_small: 9pt
  size_bullet: 9pt
spacing:
  page_margin: 0.9in
  section_gap: 16pt
  entry_gap: 10pt
  line_height: '1.35'
  header_to_content: 1mm
  skill_label_width: 4.5cm
  bullet_before: -4.0mm
  bullet_list_topsep: -1.5mm
  bullet_after: -4.0mm
  bullet_marker: bullet
latex:
  template_set: default
  engine: pdflatex
  document_class: article
  paper_size: letterpaper
  font_package: mathpazo
  font_dir: ''
  latex_style: ''
  use_icons: false
  extra_packages: []
  extra_preamble: ''
docx:
  page_width_inches: 8.5
  page_height_inches: 11.0
  use_columns: false
html:
  layout: top-header
  include_photo: false
  responsive: true
  print_friendly: true
  custom_css_file: null
  custom_js_file: null
  include_nav: false
