preset: creative
colors:
  primary: '#D84315'
  secondary: '#00897B'
  accent: '#7B1FA2'
  text: '#2C3E50'
  heading: '#D84315'
  background: '#FAFAFA'
  link: '#00897B'
  border: '#E0E0E0'
fonts:
  heading: Trebuchet MS
  body: Segoe UI
  mono: Fira Code
  size_base: 10.5pt
  size_heading: 14pt
  size_name: 28pt
  size_small: 8.5pt
  size_bullet: 9pt
spacing:
  page_margin: 0.7in
  section_gap: 14pt
  entry_gap: 8pt
  line_height: '1.35'
  header_to_content: 1mm
  skill_label_width: 4.5cm
  bullet_before: -4.0mm
  bullet_list_topsep: -1.5mm
  bullet_after: -4.0mm
  bullet_marker: bullet
latex:
  template_set: default
  engine: pdflatex
  document_class: article
  paper_size: letterpaper
  font_package: helvet
  font_dir: ''
  latex_style: ''
  use_icons: true
  extra_packages: []
  extra_preamble: ''
docx:
  page_width_inches: 8.5
  page_height_inches: 11.0
  use_columns: false
html:
  layout: cards
  include_photo: true
  responsive: true
  print_friendly: true
  custom_css_file: null
  custom_js_file: null
  include_nav: false
