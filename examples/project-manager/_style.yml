preset: classic
colors:
  primary: '#3B4252'
  secondary: '#7F8C8D'
  accent: '#5E81AC'
  text: '#333333'
  heading: '#3B4252'
  background: '#FFFFFF'
  link: '#5E81AC'
  border: '#BDC3C7'
fonts:
  heading: Georgia
  body: Garamond
  mono: Courier New
  size_base: 11pt
  size_heading: 13pt
  size_name: 22pt
  size_small: 9pt
  size_bullet: 9pt
spacing:
  page_margin: 0.75in
  section_gap: 12pt
  entry_gap: 8pt
  line_height: '1.3'
  header_to_content: 1mm
  skill_label_width: 4.5cm
  bullet_before: -4.0mm
  bullet_list_topsep: -1.5mm
  bullet_after: -4.0mm
  bullet_marker: bullet
latex:
  template_set: default
  engine: pdflatex
  document_class: article
  paper_size: letterpaper
  font_package: mathpazo
  font_dir: ''
  latex_style: ''
  use_icons: false
  extra_packages: []
  extra_preamble: ''
docx:
  page_width_inches: 8.5
  page_height_inches: 11.0
  use_columns: false
html:
  layout: top-header
  include_photo: false
  responsive: true
  print_friendly: true
  custom_css_file: null
  custom_js_file: null
  include_nav: false
