preset: modern
colors:
  primary: '#1B3A4B'
  secondary: '#546E7A'
  accent: '#3D85C6'
  text: '#212121'
  heading: '#1A237E'
  background: '#FFFFFF'
  link: '#0288D1'
  border: '#E0E0E0'
fonts:
  heading: Helvetica
  body: Source Sans Pro
  mono: Fira Code
  size_base: 10.5pt
  size_heading: 13pt
  size_name: 26pt
  size_small: 8.5pt
  size_bullet: 9pt
spacing:
  page_margin: 0.6in
  section_gap: 10pt
  entry_gap: 6pt
  line_height: '1.35'
  header_to_content: 1mm
  skill_label_width: 4.5cm
  bullet_before: -4.0mm
  bullet_list_topsep: -1.5mm
  bullet_after: -4.0mm
  bullet_marker: bullet
latex:
  template_set: default
  engine: pdflatex
  document_class: article
  paper_size: letterpaper
  font_package: helvet
  font_dir: ''
  latex_style: ''
  use_icons: true
  extra_packages: []
  extra_preamble: ''
docx:
  page_width_inches: 8.5
  page_height_inches: 11.0
  use_columns: false
html:
  layout: top-header
  include_photo: true
  responsive: true
  print_friendly: true
  custom_css_file: null
  custom_js_file: null
  include_nav: true
